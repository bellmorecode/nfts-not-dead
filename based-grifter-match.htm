<head>

</head>
<body>
	<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
		<div class="container-fluid">	
			<a href="/" class="px-3 navbar-brand">
				<span class="text-notdead">NFTS</span> NOT&nbsp;&nbsp;DEAD</a>			

				<div class="float-right">
					<button type="button" class="xbtn btn btn-link text-white text-notdead text-decoration-none connectors"  id="gameConnectButton" >CONNECT</button>
						<button type="button" class="xbtn btn btn-link text-white text-notdead text-decoration-none connectors" id="gameDisconnectButton">DISCONNECT</button>
				</div>
		</div>
	</nav>
	<div class="container">
		<div class="row d-none">
			<div class="col-12 text-center">
				<span class="walletDetails">Wallet: 0x0 Chain: 0x1</span>
			</div>
			<div class="col-12 text-center switchToBasePanel py-3" style="display: none;">
				<button class="btn btn-notdead text-white btn-sm " onclick="nnd.walletReady.switchToBase()">Switch to base</button>
			</div>
		</div>

		<div class="game-stage">
			<div class="status-message">
				<div class="message-content">
					<div class="row no-touch ">
						<div class="col-4">
							<span class="scorecard  text-center">
								XP: <span class="value">---</span>
							</span>
						</div>
						<div class="col-4 text-center">
							<span class="streak">
								BEST: <span class="value">--</span>
							</span>
						</div>
						<div class="col-4 text-end">
							<span class="appVersion">
								v.<span class="value">---</span>
							</span>
						</div>
					</div>
				</div>		
			</div>
			<div class="art">ART</div>		
			<div class="desc">DESC</div>
			<div class="buttons">
				<button type="button" data-action="start-tutorial" onclick="nnd.game.tutorial.start()">START</button>
				<button type="button" data-action="start-game" onclick="nnd.game.startGame()">START</button>
				<button type="button"  data-action="option-approve" onclick="nnd.game.approve()">APPROVE</button>
				<button type="button"  data-action="option-reject" onclick="nnd.game.reject()">REJECT</button>
				<button type="button"  data-action="continue-tutorial" onclick="nnd.game.tutorial.showWarning()">CONTINUE</button>
				<button type="button"  data-action="continue-game" onclick="nnd.game.nextToken()">CONTINUE</button>
				<button type="button"  data-action="restart-game" onclick="nnd.game.restart()">PLAY AGAIN</button>
				<button type="button"  data-action="pay-to-play" onclick="nnd.game.payToPlay()">REDEEM</button>
			</div>
			<div class="result-overlay">
				<span class="fa fa-check-circle text-success pass" style="display: none;"></span>
				<span class="fa fa-times-circle text-danger fail"  style="display: none;"></span>
			</div>
		</div>
	</div>
	<script type="text/javascript" src="/apps/jquery-3.7.1.min.js"> </script>
	<script type="text/javascript" src="/apps/web3.common.js"> </script>
	<script type="text/javascript" src="/apps/based-grifter-match.js"> </script>
</body>
</html>
